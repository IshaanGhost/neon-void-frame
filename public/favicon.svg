<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#35f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6bcb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#050b21" stroke="url(#grad1)" stroke-width="3"/>
  <!-- Gamepad body -->
  <rect x="25" y="40" width="50" height="30" rx="8" fill="url(#grad1)" opacity="0.9"/>
  <!-- Left stick -->
  <circle cx="35" cy="55" r="6" fill="#050b21"/>
  <circle cx="35" cy="55" r="3" fill="url(#grad1)"/>
  <!-- Right stick -->
  <circle cx="65" cy="55" r="6" fill="#050b21"/>
  <circle cx="65" cy="55" r="3" fill="url(#grad1)"/>
  <!-- D-pad -->
  <rect x="42" y="45" width="16" height="16" rx="2" fill="#050b21"/>
  <rect x="47" y="45" width="6" height="16" fill="url(#grad1)"/>
  <rect x="42" y="50" width="16" height="6" fill="url(#grad1)"/>
  <!-- Action buttons -->
  <circle cx="75" cy="50" r="4" fill="#050b21"/>
  <circle cx="75" cy="50" r="2.5" fill="url(#grad1)"/>
  <circle cx="75" cy="60" r="4" fill="#050b21"/>
  <circle cx="75" cy="60" r="2.5" fill="url(#grad1)"/>
</svg>

